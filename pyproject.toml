[project]
name = "rubik-rl"
version = "0.1.0"
description = "Learning to solve the Rubik's cube in the fewest moves (HTM) with RL + search"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "torch>=2.5",
    "RubikTwoPhase>=1.1",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rubik_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
